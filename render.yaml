services:
  - type: web
    name: satquery-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DEBUG
        value: "False"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: LITELLM_MODEL
        value: nvidia/nemotron-3-22b-instruct
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: ALLOW_MOCK_FALLBACK
        value: "True"
      - key: CORS_ORIGINS
        value: "*"
      - key: STAC_API_URL
        value: https://planetarycomputer.microsoft.com/api/stac/v1
      - key: STAC_COLLECTION
        value: sentinel-2-l2a
      - key: NOMINATIM_USER_AGENT
        value: SatQueryAI/1.0 (hackathon-demo)
      - key: API_RATE_LIMIT_PER_MINUTE
        value: 60
      - key: RESPONSE_CACHE_TTL_SECONDS
        value: 900
